# Builds the Android app.
# - On pushes and pull requests that change the app: builds a debug APK to check it compiles.
# - Run by hand (Actions → Android app → Run workflow): builds a signed release bundle (.aab) to upload to Google
#   Play, attached to the run as an artifact. Needs ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD
#   secrets (see docs/STORE_RELEASE.md).
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'public/**', 'capacitor.config.ts', 'package-lock.json', 'index.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['src/**', 'android/**', 'public/**', 'capacitor.config.ts', 'package-lock.json', 'index.html', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: '1.0.0'
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build the web app and copy it into the Android project
        run: npm run build && npx cap sync android

      - name: Check it builds (debug)
        if: github.event_name != 'workflow_dispatch'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release bundle
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the Android signing secrets first (see docs/STORE_RELEASE.md)."
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon bundleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: homeledger-${{ env.APP_VERSION }}-${{ github.run_number }}-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch'
        with:
          name: homeledger-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
